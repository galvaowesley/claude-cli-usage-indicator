<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="claude-usage-indicator logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#262626"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="232" height="232" rx="40" fill="url(#bg)"/>
  <rect x="4" y="4" width="232" height="232" rx="40" fill="none" stroke="#454545" stroke-width="2"/>

  <!-- abstracted sparkle: a loose nod to Claude's mark, simplified into six
       soft rays of uneven length rather than a copy of it -->
  <g transform="translate(120,96)" fill="#D97757">
    <path d="M0 -46 C 6 -20 6 -8 0 0 C -6 -8 -6 -20 0 -46 Z"/>
    <path d="M0 46 C 5 22 5 10 0 0 C -5 10 -5 22 0 46 Z" opacity="0.85"/>
    <path d="M39 -22 C 18 -10 8 -4 0 0 C 6 -10 16 -18 39 -22 Z"/>
    <path d="M-39 22 C -17 11 -7 5 0 0 C -5 9 -15 17 -39 22 Z" opacity="0.85"/>
    <path d="M39 22 C 17 11 7 5 0 0 C 6 9 16 17 39 22 Z" opacity="0.7"/>
    <path d="M-39 -22 C -18 -10 -8 -4 0 0 C -6 -10 -16 -18 -39 -22 Z" opacity="0.7"/>
  </g>

  <!-- usage band, segmented: claude (orange) / system (blue), like the statusline -->
  <rect x="40" y="176" width="160" height="18" rx="9" fill="#1f1f1f"/>
  <rect x="40" y="176" width="92" height="18" rx="9" fill="#D97757"/>
  <rect x="132" y="176" width="68" height="18" rx="9" fill="#7fb0e0"/>

  <!-- three status dots, green/yellow/red severity scale -->
  <circle cx="60" cy="210" r="7" fill="#8fdc93"/>
  <circle cx="84" cy="210" r="7" fill="#ffd75f"/>
  <circle cx="108" cy="210" r="7" fill="#ff5f87"/>
</svg>
